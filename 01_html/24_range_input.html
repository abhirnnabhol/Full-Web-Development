<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>range</title>
</head>
<body>
    <form action="/server">

        <div>
            <label for="Vol">Volume: </label>
            <input type="range" name="Vol" max="100" min="0" step="5">
        </div>
        <label for="feed">please give your feedback</label>
        <textarea id="feed" name="feed"></textarea>
        <button>submit</button>
    </form>
    
</body>
</html>
