<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <form action="/server">
        <div>
            CHOOSE YOUR FAVOURITE COLOR:
            <input type="radio" name="ans" id="g" value="green">
            <label for="g">GREEN</label>
            <input type="radio" name="ans" id="b" value="black">
            <label for="b">BLACK</label>
            <input type="radio" name="ans" id="r" value="red">
            <label for="r">RED</label>
        </div>
        <div>
            CHOOSE YOUR FAVOURITE COLOR:
            <input type="checkbox" name="ans" id="g" value="green">
            <label for="g">GREEN</label>
            <input type="checkbox" name="ans" id="b" value="black">
            <label for="b">BLACK</label>
            <input type="checkbox" name="ans" id="r" value="red">
            <label for="r">RED</label>
        </div>
    </form>
</body>
</html>
