<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>question 1</title>
    </head>
    <body>
        <table>
            <caption>Student Information</caption>
            <tr>
                <th rowspan="6">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>
            <tr>
                <td>A</td>
                <td>Delhi</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>Mumbai</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Kolkata</td>
                <td>3</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Pune</td>
                <td>4</td>
            </tr>
        </table>
        <hr>
        <form action="/server">
            <div>
                <label for="name">Name:</label>
                <input  type="text" id="name" name="name">
            </div>
            <div>
                Sex:
                <input type="radio" name="name" value="Male" id="m">
                <label for="m">Male</label>
                <input type="radio" name="name" value="Female" id="f">
                <label for="f">Female</label>
            </div>
            <div>
                Country:
                <select name="country" id="country">
                    <option>Select an option</option>
                    <option value="ind">India</option>
                </select>
            </div>
            <div>
                <label for="mess">Message:</label>
                <br>
                <textarea id="mess" rows="3" cols="35"></textarea>
            </div>
            <div>
                <input type="checkbox" name="ans" id="ans">
                <label for="ans">Subscribe?</label>
            </div>
            <button>Submit</button>
        </form>
        <hr>
        <form action="/server">
            <h2>Feedback Form</h2>
            <div>
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="Write your name">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="text" name="Email" id="email" placeholder="Write your email">
            </div>
            <br>
            <div>
                <label for="mess">Message:</label>
                <br>
                <textarea name="mess" id="mess"></textarea>
            </div>
            Rate us our of 5:
            <div>
                <input type="radio" name="rate" id="1" value="1">
                <label for="1">1</label>
                <br>
                <input type="radio" name="rate" id="2" value="2">
                <label for="2">2</label>
                <br>
                <input type="radio" name="rate" id="3" value="3">
                <label for="3">3</label>
                <br>
                <input type="radio" name="rate" id="4" value="4">
                <label for="4">4</label>
                <br>
                <input type="radio" name="rate" id="5" value="5">
                <label for="5">5</label>
            </div>
            <button>Send your message!</button>
        </form>
    </body>
</html>
