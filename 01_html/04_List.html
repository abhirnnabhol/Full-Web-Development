<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List introduction</title>
    </head>
    <body>
        <ul>
            <li>bread
                <ol>
                    <li>brown bread</li>
                    <li>white bread</li>
                </ol>
            </li>
            <li>samosa</li>
            <li>juice</li>
            <li>pizza</li>
            <li>biryani</li>
        </ul>
    </body>
    <body>
        <ol type="a">
            <li>bread</li>
            <li>samosa</li>
            <li>juice</li>
            <li>pizza</li>
            <li>biryani</li>
        </ol>
    </body>
</html>
